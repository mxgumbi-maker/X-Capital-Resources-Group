<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Margin">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Margin — talk with your kid about school</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2e3d; --ink-soft:#6b7280; --paper:#f8f8fb; --paper-dim:#eef0f7; --chalk:#e4e7f1;
    --primary:#7c6fe0; --primary-strong:#5b4fc4; --primary-soft:#efecfd; --sage:#3fa876; --sage-bg:#e6f6ee;
    --silver:#c7cbe0; --silver-deep:#9aa0c2; --line: rgba(43,46,61,0.10);
    --marigold:#e0a030; --marigold-deep:#c9821f; --clay:#e2695a; --clay-bg:#fdece9;
    --teal:#1f9d85; --teal-deep:#187b68;
    --shadow: 0 1px 3px rgba(43,46,61,0.05), 0 8px 20px rgba(43,46,61,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior-y: none;}
  .display{font-family:'Poppins', -apple-system, sans-serif; font-weight:700;}
  .hand{font-family:'Caveat', cursive;}
  a{color:inherit;} button{font-family:inherit;}

  .shell{max-width:600px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom));}
  header.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:14px; margin-bottom:14px;
    border-bottom:2px solid var(--chalk); position:sticky; top:0; background:rgba(248,248,251,0.92); backdrop-filter:blur(8px); z-index:5; padding-top:2px;}
  .logo{display:flex;align-items:center;gap:8px; min-width:0; flex:1;}
  .logo .mmark{width:26px; height:26px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--teal); color:#fff; font-family:'Poppins',sans-serif; font-weight:800; font-size:13px;}
  .logo .mark{font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.01em; color:var(--primary-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .logo .tag{font-size:11.5px; color:var(--ink-soft); font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .top-login{display:flex; align-items:center; gap:10px; margin-left:auto; padding:7px 10px; border:1px solid var(--line); border-radius:999px; background:#ffffff; box-shadow:var(--shadow);}
  .top-login .login-pill{padding:5px 10px; border-radius:999px; background:var(--primary-soft); color:var(--primary-strong); font-weight:700; font-size:11px; letter-spacing:.04em; text-transform:uppercase;}
  .top-login .login-meta{font-size:11.5px; color:var(--ink-soft); font-weight:600; line-height:1.2; text-align:right;}

  .child-row{display:flex; gap:8px; overflow-x:auto; flex-wrap:nowrap; padding:2px 2px 10px; margin-bottom:6px; scrollbar-width:none;}
  .child-row::-webkit-scrollbar{display:none;}
  .chip{display:inline-flex; align-items:center; gap:6px; flex:none; padding:9px 14px; border-radius:999px; border:1.5px solid var(--line);
    background:#ffffff; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink-soft); transition:all .15s ease;}
  .chip.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  .chip.add{background:transparent; border-style:dashed; color:var(--teal);}
  .chip .x{padding:2px; opacity:.6;}

  .card{background:#ffffff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:20px;}
  .card + .card{margin-top:12px;}

  .coach-hero{padding:22px 20px; background:var(--primary-soft); border:1px solid var(--line);}
  .coach-hero h2{margin:0 0 10px; font-size:24px; line-height:1.15; color:var(--primary-strong);}
  .coach-hero p{margin:0; color:var(--ink-soft); line-height:1.6; font-size:14px;}
  .benefit-grid{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin-top:18px;}
  .benefit-tile{padding:16px 14px; border-radius:12px; background:#ffffff; border:1px solid var(--line); box-shadow:var(--shadow);}
  .benefit-tile .icon{font-size:18px; margin-bottom:8px; }
  .benefit-tile h3{margin:0 0 6px; font-size:14px; color:var(--ink);}
  .benefit-tile p{margin:0; color:var(--ink-soft); font-size:12.5px; line-height:1.5;}
  .tab-btn{flex:1; padding:12px 0; border:none; background:transparent; border-radius:9px; font-weight:800; font-size:14px; color:var(--ink-soft); cursor:pointer; letter-spacing:0.02em;}
  .tab-btn.active-tab{background:#ffffff; color:var(--ink); box-shadow:var(--shadow);}

  .onboard{text-align:center; padding:40px 22px; max-width:440px; margin:24px auto;}
  .onboard .mark-big{font-size:36px; margin-bottom:6px;}
  .onboard h1{font-size:22px; margin:0 0 8px; font-weight:600;}
  .onboard p{color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin:0 0 22px;}
  .field-stack{display:flex; flex-direction:column; gap:10px;}

  input[type=text], textarea{font-family:inherit; font-size:16px; padding:12px 14px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--paper-dim); color:var(--ink); outline:none; width:100%;}
  input[type=text]:focus, textarea:focus{border-color:var(--teal);}
  input:disabled, textarea:disabled{opacity:.65;}
  textarea{resize:vertical;}

  .btn{font-weight:700; font-size:15px; padding:13px 20px; border-radius:10px; border:none; cursor:pointer;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:disabled{opacity:.45;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  .btn-block{width:100%;}

  .section-eyebrow{text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:700; color:var(--ink-soft); margin:18px 0 10px;}
  .section-eyebrow:first-child{margin-top:2px;}

  .analyzing{display:flex; align-items:center; gap:13px;}
  .spinner{width:20px; height:20px; border-radius:50%; border:3px solid var(--chalk); border-top-color:var(--teal); animation:spin 0.8s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .analyzing-txt{font-size:14px; color:var(--ink-soft);}

  .tab-row{display:flex; gap:4px; background:var(--paper-dim); padding:4px; border-radius:12px; margin-bottom:14px;}
  .tab-btn{flex:1; padding:9px 0; border:none; background:transparent; border-radius:9px; font-weight:600; font-size:13.5px; color:var(--ink-soft); cursor:pointer;}
  .tab-btn.active-tab{background:#ffffff; color:var(--ink); box-shadow:var(--shadow);}
  .plan-summary-row{display:flex; align-items:center; justify-content:space-between;}
  .plan-progress-track{background:var(--chalk); border-radius:99px; height:6px; margin-top:8px; overflow:hidden;}
  .plan-progress-fill{background:var(--sage); height:100%; border-radius:99px;}

  .empty-state{text-align:center; padding:38px 18px;}
  .empty-state .ico{font-size:28px; margin-bottom:8px;}
  .empty-state .t1{font-weight:600; margin-bottom:3px; font-size:15px;}
  .sub-txt{font-size:13px; color:var(--ink-soft);}

  .src-tag{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .result-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
  .result-date{font-size:12px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .icon-btn{background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:15px; padding:5px 7px; border-radius:6px;}
  .icon-btn:active{color:var(--clay); background:var(--clay-bg);}

  .summary-txt{font-size:14.5px; line-height:1.6; color:var(--ink); margin:0 0 14px;}
  .entry-photo{width:100%; max-height:260px; object-fit:cover; border-radius:12px; margin-bottom:14px; display:block; border:1px solid var(--line);}

  .subject-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--chalk);}
  .subject-row:first-of-type{border-top:none;}
  .subject-name{font-weight:600; font-size:14px;}
  .subject-score{font-weight:700; font-size:12.5px; padding:3px 9px; border-radius:6px; white-space:nowrap;}
  .score-strong{background:var(--sage-bg); color:var(--sage);}
  .score-steady{background:rgba(224,160,48,0.14); color:var(--marigold-deep);}
  .score-needs_attention{background:var(--clay-bg); color:var(--clay);}

  .twocol{display:flex; flex-direction:column; gap:14px; margin-top:16px;}
  .pill-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .pill-list li{font-size:13.5px; line-height:1.4; padding-left:16px; position:relative;}
  .pill-list.strength li:before{content:"✓"; position:absolute; left:0; color:var(--sage); font-weight:700;}
  .pill-list.growth li:before{content:"→"; position:absolute; left:0; color:var(--clay); font-weight:700;}

  .questions-block{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line);}
  .q-item{display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:14px; line-height:1.5;}
  .q-item input[type=checkbox]{margin-top:3px; width:19px; height:19px; accent-color:var(--sage); flex:none; cursor:pointer;}
  .q-item.asked label{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}
  .q-item label{cursor:pointer;}
  .cadence{color:var(--ink-soft); font-weight:500; font-size:12px;}
  .plan-goal{font-weight:600; font-size:14px; margin-bottom:8px;}

  .encourage{margin-top:16px; padding:13px 15px; background:var(--paper-dim); border-radius:10px; font-family:'Caveat',cursive; font-size:19px; color:var(--ink); border-left:3px solid var(--marigold);}

  .tl-row{display:flex; align-items:center; gap:12px; padding:13px 15px; cursor:pointer; border:1px solid var(--line); border-radius:12px; background:#ffffff; margin-bottom:8px;}
  .tl-row:active{border-color:var(--teal);}
  .tl-date{font-size:12px; font-weight:700; color:var(--ink-soft); width:56px; flex:none;}
  .tl-badges{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .tl-badge{font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:5px;}
  .tl-chev{color:var(--ink-soft); font-size:13px;}

  .err-banner{background:var(--clay-bg); color:var(--clay); border-radius:10px; padding:12px 14px; font-size:13.5px; margin-bottom:12px;}
  input[type=file]{display:none;}
  .privacy-note{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:20px; line-height:1.5;}

  .fab{position:fixed; right:20px; bottom:calc(22px + env(safe-area-inset-bottom)); width:58px; height:58px; border-radius:50%;
    background:var(--teal); color:#fff; font-size:28px; line-height:1; display:flex; align-items:center; justify-content:center;
    border:none; box-shadow:var(--shadow); cursor:pointer; z-index:50;}
  .fab:active{transform:scale(0.94);}

  .sheet-overlay{position:fixed; inset:0; background:rgba(43,46,61,0.35); z-index:60; animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .sheet{position:fixed; left:0; right:0; bottom:0; background:#ffffff; border-radius:20px 20px 0 0; padding:8px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; z-index:61; box-shadow:0 -10px 30px rgba(43,46,61,0.18); animation:slideUp .2s ease;}
  @keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
  .sheet-handle{width:38px; height:4px; background:var(--chalk); border-radius:99px; margin:8px auto 6px;}
  .sheet-close{position:absolute; top:10px; right:12px;}
  .sheet-title{font-weight:700; font-size:15.5px; margin:10px 0 14px;}

  .action-btn-big{display:flex; align-items:center; gap:12px; width:100%; padding:16px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--paper-dim); font-weight:600; font-size:15px; cursor:pointer; text-align:left; color:var(--ink);}
  .action-btn-big:active{border-color:var(--teal);}
  .action-btn-big .em{font-size:20px;}

  .manual-row{padding:12px 0; border-top:1px solid var(--chalk);}
  .manual-row:first-child{border-top:none; padding-top:2px;}
  .manual-inputs{display:flex; gap:8px;}
  .chip-group{margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;}
  .chip-mini{display:inline-block; padding:5px 11px; border-radius:999px; font-size:11.5px; font-weight:700; border:1.5px solid transparent; cursor:pointer; opacity:.4;}
  .chip-mini.active-mini{opacity:1; border-color:currentColor;}
  .sheet-err{color:var(--clay); font-size:13px; margin-top:8px;}

  .plan-summary-row2{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .rag-chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:11.5px; font-weight:700; cursor:pointer; white-space:nowrap; border:none;}
  .rag-chip:before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor; flex:none;}
  .rag-green{background:var(--sage-bg); color:var(--sage);}
  .rag-amber{background:rgba(224,160,48,0.14); color:var(--marigold-deep);}
  .rag-red{background:var(--clay-bg); color:var(--clay);}
  .rag-none{background:var(--paper-dim); color:var(--ink-soft);}

  .plan-row-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .plan-subject-input{font-weight:700; font-size:15.5px; border:none; background:transparent; padding:4px 0; flex:1; border-bottom:1.5px solid transparent; appearance:none; -webkit-appearance:none; font-family:inherit; color:var(--ink); cursor:pointer;}
  .plan-subject-input:focus{border-bottom-color:var(--teal); outline:none;}
  select.plan-subject-input:disabled{opacity:.65; cursor:default;}
  .day-picker{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .day-chip{width:38px; height:32px; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; border-radius:8px; border:1.5px solid var(--line); cursor:pointer; color:var(--ink-soft); background:#ffffff;}
  .day-chip.day-active{background:var(--teal); border-color:var(--teal); color:#fff;}
  input[type=time]{font-family:inherit; font-size:14px; padding:9px 10px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper-dim); color:var(--ink);}
  .plan-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .mini-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700; margin-bottom:4px;}
  .plan-grid input[type=text]{font-size:14px; padding:10px 12px;}
  .plan-row-foot{display:flex; justify-content:space-between; align-items:center; margin-top:12px;}

  .session-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .session-top input[type=date]{width:auto; flex:none; padding:9px 10px; font-size:13px; font-family:inherit; border-radius:9px; border:1.5px solid var(--line); background:var(--paper-dim); color:var(--ink);}
  .session-done-label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;}
  .session-done-label input{width:18px; height:18px; accent-color:var(--sage); cursor:pointer;}
  .suggested-tag{font-size:12px; color:var(--teal); margin-top:6px;}

  .confirm-pending{background:var(--clay) !important; color:#fff !important; font-weight:700; padding:5px 10px; border-radius:7px; font-size:12px;}
  .note-save-row{display:flex; justify-content:flex-end; margin-top:8px; gap:8px;}
  .btn-save-note{background:var(--paper-dim); border:1.5px solid var(--line); color:var(--ink-soft); font-weight:700; font-size:12.5px; padding:7px 14px; border-radius:8px; cursor:pointer;}
  .btn-save-note.saved{background:var(--sage-bg); color:var(--sage); border-color:transparent;}
  .btn-cal{background:var(--paper-dim); border:1.5px solid var(--line); color:var(--ink-soft); font-weight:700; font-size:12.5px; padding:7px 14px; border-radius:8px; cursor:pointer;}
  .btn-cal:disabled{opacity:.4; cursor:default;}

  .fold-row{display:flex; align-items:center; gap:10px; padding:13px 15px; cursor:pointer; border:1px solid var(--line); border-radius:12px; background:#ffffff; margin-bottom:8px;}
  .fold-row:active{border-color:var(--teal);}
  .fold-title{font-weight:600; font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fold-chev{color:var(--ink-soft); font-size:13px; flex:none;}

  /* ---------- modes / profile / avatars / gamification ---------- */
  .mode-row{display:flex; gap:4px; background:var(--paper-dim); padding:4px; border-radius:12px; margin-bottom:12px;}
  .mode-pill{flex:1; padding:8px 0; border:none; background:transparent; border-radius:9px; font-weight:700; font-size:12.5px; color:var(--ink-soft); cursor:pointer;}
  .mode-pill.active-mode{background:var(--primary); color:#fff;}
  .mode-pill:disabled{opacity:.35; cursor:default;}

  .profile-bar{display:flex; align-items:center; gap:12px; padding:10px 4px; margin-bottom:10px; cursor:pointer;}
  .profile-bar.static{cursor:default;}
  .avatar-circle{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:21px; flex:none; box-shadow:var(--shadow);}
  .profile-info{flex:1; min-width:0;}
  .profile-name{font-weight:700; font-size:14.5px;}

  .emoji-grid{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .emoji-opt{width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:19px; border-radius:10px; border:1.5px solid var(--line); cursor:pointer; background:#ffffff;}
  .emoji-opt.emoji-active{border-color:var(--teal); background:var(--primary-soft);}
  .color-grid{display:flex; gap:8px; margin:4px 0 8px;}
  .color-opt{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .color-opt.color-active{border-color:var(--ink);}
  .avatar-picker-preview{width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:4px auto 4px;}

  .badge-chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--paper-dim); color:var(--ink-soft);}
  .welcome-back{border-color:var(--marigold) !important;}

  .cg-note{font-size:12.5px; color:var(--ink-soft); margin-top:12px; line-height:1.5;}
  .summary-box{width:100%; min-height:220px; font-family:'Inter',monospace; font-size:12.5px; line-height:1.5; white-space:pre-wrap; padding:12px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper-dim); color:var(--ink);}

  .gap-row{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; padding-bottom:14px; border-bottom:1px dashed var(--line);}
  .gap-metric{text-align:center;}
  .gap-value{font-weight:700; font-size:17px;}
  .gap-arrow{color:var(--ink-soft); font-size:14px;}
  .gap-chip{margin-left:auto; font-size:12px; font-weight:700; padding:5px 11px; border-radius:999px; white-space:nowrap;}
  .gap-met{background:var(--sage-bg); color:var(--sage);}
  .gap-open{background:rgba(224,160,48,0.14); color:var(--marigold-deep);}
  .gap-unknown{background:var(--paper-dim); color:var(--ink-soft);}

  .lock-toggle{cursor:pointer; font-weight:700; color:var(--teal); text-transform:none; letter-spacing:0; font-size:10.5px;}
  .lock-toggle.static{cursor:default; color:var(--ink-soft);}
  .notes-log{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .note-entry{background:var(--paper-dim); border-radius:9px; padding:9px 12px;}
  .note-entry-text{font-size:13.5px; line-height:1.4; white-space:pre-wrap;}
  .note-entry-meta{font-size:11px; color:var(--ink-soft); margin-top:4px; font-weight:600;}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<input type="file" id="global-file-input" accept="image/*" capture="environment">

<script>
const AVATAR_EMOJIS = ['🙂','😄','🦁','🐯','🐼','🦊','🐸','🦉','🌟','🚀','🎨','⚽','📚','🎵','🌈','🐉'];
const AVATAR_COLORS = ['#DC9A3C','#5F8A68','#BF5E45','#6C8EBF','#9B6FB0','#4A5568'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const state = {
  children: [],
  activeChildId: null,
  resultsByChild: {},
  plansByChild: {},
  sessionsByChild: {},
  tipsByChild: {},
  parentProfile: null,     // {name, email, avatarEmoji, avatarColor, pin}

// ---------- storage helpers ----------
async function storeGet(key){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch(e){
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch(inner){
      return null;
    }
  }
}
async function storeSet(key, value){
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, JSON.stringify(value), false);
      return;
    }
    if(typeof localStorage !== 'undefined'){
      localStorage.setItem(key, JSON.stringify(value));
      return;
    }
  } catch(e){
    console.error('storage set failed', e);
  }
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function stripOpen(list){ return list.map(({_open, ...rest})=>rest); }

// ---------- init ----------
async function init(){
  state.parentProfile = await storeGet('parentProfile');

  const lastActive = await storeGet('lastActive');
  const now = Date.now();
  if(lastActive && (now - lastActive) > (1000*60*60*24*90)) state.showWelcomeBack = true;
  await storeSet('lastActive', now);

  const children = await storeGet('children');
  state.children = children || [];
  if(state.children.length){
    state.activeChildId = state.children[0].id;
    await loadChildData(state.activeChildId);
  }
  render();
}
async function loadChildData(childId){
  if(!state.resultsByChild[childId]) state.resultsByChild[childId] = (await storeGet('results:'+childId)) || [];
  state.resultsByChild[childId] = (state.resultsByChild[childId] || []).map(entry => ({ ...entry, _open: entry._open !== undefined ? entry._open : true }));
  if(!state.plansByChild[childId]) state.plansByChild[childId] = (await storeGet('plan:'+childId)) || [];
  if(!state.sessionsByChild[childId]) state.sessionsByChild[childId] = (await storeGet('sessions:'+childId)) || [];
  if(!state.tipsByChild[childId]) state.tipsByChild[childId] = (await storeGet('tips:'+childId)) || [];
  await pruneExpired(childId);
}

function mergePlanFromResult(childId, subjects, subjectPlans, suggestedSession){
  const plan = state.plansByChild[childId] || [];
  subjects.forEach(s=>{
    const match = plan.find(p=>p.subject.trim().toLowerCase()===s.name.trim().toLowerCase());
    const suggestion = (subjectPlans||[]).find(sp=>sp.name && sp.name.trim().toLowerCase()===s.name.trim().toLowerCase());
    if(match){
      match.currentResult = s.score;
      match.lastUpdated = new Date().toISOString();
      match._open = true;
      if(!match.targetResult && !match.targetLocked && suggestion) match.targetResult = suggestion.targetResult ? formatAsPercent(suggestion.targetResult) : '';
      if(suggestion && suggestion.studySchedule) match.studyScheduleHint = suggestion.studySchedule;
      if(!match.practiceTestOption && suggestion) match.practiceTestOption = suggestion.practiceTestOption || 'none';
      if(!match.notes && suggestion) match.notes = suggestion.notes || '';
    } else {
      plan.push({
        id: uid(), 
        subject: s.name, 
        currentResult: s.score,
        targetResult: suggestion && suggestion.targetResult ? formatAsPercent(suggestion.targetResult) : '',
        targetLocked: false,
        studyDays: [], 
        studyTime: '',
        studyScheduleHint: suggestion ? (suggestion.studySchedule||'') : '',
        practiceTestOption: suggestion ? (suggestion.practiceTestOption || 'none') : 'none',
        practiceTestDate: '',
        practiceTestTime: '',
        practiceTestSchedule: '',
        notes: suggestion ? (suggestion.notes || '') : '', 
        notesLog: [], 
        rag: null, 
        lastUpdated: new Date().toISOString(), 
        _open: true,
        notesDraft: ''
      });
    }
  });
  state.plansByChild[childId] = plan;
  persistPlan(childId);
  if(suggestedSession && suggestedSession.topic){
    const sessions = state.sessionsByChild[childId] || [];
    sessions.unshift({ id: uid(), date:'', topic: suggestedSession.topic, done:false, suggested:true, _open:true });
    state.sessionsByChild[childId] = sessions;
    persistSessions(childId);
  }
}

function downloadICS(title, description, dateStr){
  if(!dateStr) return;
  const dt = dateStr.replace(/-/g,'');
  const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Margin//EN\nBEGIN:VEVENT\nUID:${uid()}@margin.app\nDTSTART;VALUE=DATE:${dt}\nSUMMARY:${(title||'Study session').replace(/\n/g,' ')}\nDESCRIPTION:${(description||'').replace(/\n/g,' ')}\nEND:VEVENT\nEND:VCALENDAR`;
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'margin-reminder.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function buildLocalTip(subject, struggle, grade=''){
  const subjectLower = subject.toLowerCase();
  const struggleLower = struggle.toLowerCase();
  
  // Map of subject-specific tips
  const tipLibrary = {
    'math': {
      parentTip: {
        headline: 'Work through one problem together, step by step',
        explanation: 'Math builds on understanding each step. Solve one example together, then let them try the next one.',
        tryThis: 'Pick a similar problem and ask "What would we do first?" after each step.'
      },
      childTip: {
        headline: 'Start with a problem you can do, build from there',
        explanation: 'You learn best by doing similar problems in order—easier to harder. It helps your brain see the pattern.',
        tryThis: 'Do the easiest problem first, then the next one. Say each step out loud.'
      }
    },
    'english': {
      parentTip: {
        headline: 'Read the passage aloud together, then ask what happened',
        explanation: 'Hearing the words helps with comprehension. Questions check understanding without pressure.',
        tryThis: 'Read one paragraph, then ask "What just happened?" and listen to their answer.'
      },
      childTip: {
        headline: 'Read it twice—once fast, once slow—then retell it',
        explanation: 'Your brain remembers stories better when you say them in your own words. That\'s understanding.',
        tryThis: 'Read the section once, then tell someone what you just read as if explaining a movie.'
      }
    },
    'science': {
      parentTip: {
        headline: 'Show a real example, then explain why it works that way',
        explanation: 'Science makes sense when you see it in the real world. Connection helps memory.',
        tryThis: 'Find something at home that relates to the topic and ask them to explain it to you.'
      },
      childTip: {
        headline: 'Find a real example around you, then look up how it works',
        explanation: 'Science is everywhere. When you connect it to real life, it sticks in your memory.',
        tryThis: 'Look for one thing in your house or outside that uses this idea. Draw it or describe it.'
      }
    },
    'history': {
      parentTip: {
        headline: 'Ask "Why did this happen?" and "How did it change things?"',
        explanation: 'History isn\'t just facts—it\'s stories about cause and effect. That\'s what sticks.',
        tryThis: 'Pick one event and ask them to explain what caused it and what happened after.'
      },
      childTip: {
        headline: 'Think of it as a story with reasons and consequences',
        explanation: 'History is easier to remember when you see it as a chain of "why" and "what happened next."',
        tryThis: 'Draw a timeline with 3 events. For each, write one reason it happened and one result.'
      }
    }
  };
  
  // Find the best-matching subject tip
  let selectedTip = null;
  for (const key in tipLibrary) {
    if (subjectLower.includes(key) || key.includes(subjectLower)) {
      selectedTip = tipLibrary[key];
      break;
    }
  }
  
  // If no specific subject match, use a generic growth tip
  if (!selectedTip) {
    selectedTip = {
      parentTip: {
        headline: `Take one small part of ${subject}, practice it together`,
        explanation: `Breaking ${subject} into smaller pieces makes it less overwhelming. Repetition builds confidence.`,
        tryThis: `Ask your child "What's the hardest part?" and focus only on that one thing for 10 minutes.`
      },
      childTip: {
        headline: `Pick one small part to practice, not the whole thing`,
        explanation: `You learn better by mastering small pieces first, then building up. This is how everyone learns.`,
        tryThis: `Focus on just one idea or skill for today. Do it a few times. That's real progress.`
      }
    };
  }
  
  // Customize based on struggle keywords
  if (struggleLower.includes('remember') || struggleLower.includes('forget')) {
    selectedTip.parentTip.tryThis = `Try a memory trick: acronym, rhyme, or story. Ask them to teach it back to you.`;
    selectedTip.childTip.tryThis = `Make up a funny sentence or rhyme to remember the tricky part.`;
  } else if (struggleLower.includes('confused') || struggleLower.includes('confusing')) {
    selectedTip.parentTip.tryThis = `Draw it, act it out, or find a video. Sometimes another way of seeing it clicks.`;
    selectedTip.childTip.tryThis = `Ask for an example or picture. Sometimes seeing it a different way makes it click.`;
  } else if (struggleLower.includes('slow') || struggleLower.includes('speed')) {
    selectedTip.parentTip.tryThis = `Practice the same type of problem a few times. Speed comes after understanding.`;
    selectedTip.childTip.tryThis = `Do the same type of problem 3 times. You'll get faster as you practice.`;
  } else if (struggleLower.includes('test') || struggleLower.includes('exam')) {
    selectedTip.parentTip.tryThis = `Practice with old tests or sample questions under timed conditions.`;
    selectedTip.childTip.tryThis = `Try some practice questions with a timer. That's how you get ready for the real thing.`;
  }
  
  return selectedTip;
}

function parseNumeric(str){
  if(!str) return null;
  const m = String(str).match(/(\d+(?:\.\d+)?)/);
  if(!m) return null;
  const n = parseFloat(m[1]);
  return isNaN(n) ? null : n;
}
function computeGapDisplay(current, target){
  const c = parseNumeric(current), t = parseNumeric(target);
  if(c===null || t===null) return null;
  const diff = +(t - c).toFixed(1);
  if(diff <= 0) return { text: 'Target met 🎉', cls:'gap-met' };
  return { text: `${diff} pt${diff===1?'':'s'} to go`, cls:'gap-open' };
}
function formatAsPercent(raw){
  const n = parseNumeric(raw);
  if(n===null) return raw;
  const capped = Math.min(100, n);
  return (Number.isInteger(capped) ? capped : capped) + '%';
}
function getStudyTimeConflict(childId, rowId){
  const row = (state.plansByChild[childId] || []).find(r => r.id === rowId);
  if(!row || !row.studyTime) return null;
  const conflicts = [];
  (state.plansByChild[childId] || []).forEach(other => {
    if(other.id === rowId || !other.studyTime) return;
    const sharedDays = (row.studyDays || []).filter(day => (other.studyDays || []).includes(day));
    if(sharedDays.length && other.studyTime === row.studyTime){
      conflicts.push(other.subject || 'Another subject');
    }
  });
  return conflicts.length ? conflicts : null;
}

}

function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
const RETENTION_DAYS = 30;
function daysUntilExpiry(iso){

// ---------- trend line (goals, trajectory, performance) ----------
function buildTrendSVG(childId, subjectName, targetResult){
  const points = [];
  (state.resultsByChild[childId]||[]).slice().reverse().forEach(e=>{
    const subj = (e.subjects||[]).find(s=>s.name.trim().toLowerCase()===subjectName.trim().toLowerCase());
    if(subj){ const val = parseNumeric(subj.score); if(val!==null) points.push({date:e.date, val}); }
  });
  if(points.length < 2){
    return `<div class="sub-txt" style="padding:10px 0 2px;">Not enough numeric results yet to chart a trend. Scores like "78%" work best.</div>`;
  }
  const W=280,H=90,PAD=10;
  const targetVal = parseNumeric(targetResult);
  const allVals = targetVal!==null ? points.map(p=>p.val).concat([targetVal]) : points.map(p=>p.val);
  const min = Math.max(0, Math.min(...allVals) - 10);
  const max = Math.min(100, Math.max(...allVals) + 10) || 100;
  const range = (max-min) || 1;
  const stepX = points.length>1 ? (W - PAD*2) / (points.length - 1) : 0;
  const toY = v => H - PAD - ((v - min)/range) * (H - PAD*2);
  const coords = points.map((p,i)=> `${(PAD + i*stepX).toFixed(1)},${toY(p.val).toFixed(1)}`).join(' ');
  const targetY = targetVal!==null ? toY(targetVal).toFixed(1) : null;
  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block; margin-top:6px;">
      ${targetY ? `<line x1="${PAD}" y1="${targetY}" x2="${W-PAD}" y2="${targetY}" style="stroke:var(--marigold); stroke-width:1.5; stroke-dasharray:4,3;"/>` : ''}
      <polyline points="${coords}" fill="none" style="stroke:var(--sage); stroke-width:2.5;"/>
      ${points.map((p,i)=>`<circle cx="${(PAD + i*stepX).toFixed(1)}" cy="${toY(p.val).toFixed(1)}" r="3.5" style="fill:var(--sage);"/>`).join('')}
    </svg>
    ${targetVal!==null ? `<div class="sub-txt">Dashed line: target (${escapeHtml(targetResult)})</div>` : ''}
  `;
}

function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1024; quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function localScoreToNumber(value){

    return {
      isAcademicResult: false,
      subjects: [],
      overallSummary: 'I could not clearly read an academic result in the image. Try uploading a clearer view of the marks or worksheet.',
      strengths: [],
      growthAreas: [],
      coachingQuestions: ['What part felt easiest today?', 'Which task felt most confusing?', 'What could we make simpler together?', 'When is the best time to review this?', 'What do you want to try first this week?'],
      encouragement: 'You are not behind; we can work from what we see and take the next step together.',
      subjectPlans: [],
      suggestedSession: { topic: 'Review the toughest subject together and choose one small win for this week' }
    };
  }

  const scoreValues = loaded.map(s => ({...s, value: localScoreToNumber(s.score)}));
  const validValues = scoreValues.filter(s => s.value !== null);
  const avg = validValues.length ? (validValues.reduce((sum, s) => sum + s.value, 0) / validValues.length) : 0;
  const best = validValues.slice().sort((a, b) => b.value - a.value)[0];
  const weakest = validValues.slice().sort((a, b) => a.value - b.value)[0];

  const strengths = [];
  const growthAreas = [];
  const subjectPlans = [];

  if(avg >= 75){ strengths.push('Solid overall momentum'); }
  else if(avg >= 60){ strengths.push('Steady progress'); }
  else { strengths.push('A strong foundation is still there'); }

  if(best){ strengths.push(`${best.name} is a good current strength`); }
  if(weakest){ growthAreas.push(`Focus on ${weakest.name} to build confidence`); }
  if(avg < 70){ growthAreas.push('Break tasks into smaller steps and check them as you go'); }
  else { strengths.push('Reviewing the right mistakes is helping'); }

  const coachingQuestions = [
    `Which result felt most encouraging for ${childName || 'your child'} today?`,
    'What part of the work felt hardest to finish?',
    'What is one thing we can practise a little more this week?',
    'When would be the easiest time to revisit this together?',
    'How can we make the next task feel more manageable?'
  ];

  const encouragement = avg >= 70
    ? 'You are doing better than it first looks. We can build on the strengths already showing up.'
    : 'This is a useful snapshot, not a verdict. We can turn the rough spots into a small, clear plan.';

  loaded.forEach(s => {
    const value = localScoreToNumber(s.score);
    const target = value === null ? '75%' : `${Math.min(100, Math.max(value + 10, 70))}%`;
    const isPracticeTestMock = value !== null && value < 50;
    subjectPlans.push({
      name: s.name,
      targetResult: target,
      studySchedule: '15–20 minutes on two evenings this week',
      practiceTestOption: isPracticeTestMock ? 'mock' : 'quick',
      notes: value !== null && value < 70 ? 'Start with the easiest questions and build up from there.' : 'Keep a short review routine and check progress after each session.'
    });
  });

  const suggestedSubject = weakest && weakest.name ? weakest.name : (loaded[0] && loaded[0].name ? loaded[0].name : 'Core learning');

  return {
    isAcademicResult: true,
    subjects: loaded,
    overallSummary: notes && notes.trim()
      ? `Overall, the work shows a few areas to keep building on, with ${suggestedSubject} being the clearest place to focus. ${notes.trim()}`
      : `Overall, the result shows a mix of strengths and a few places to strengthen. The most useful move is to focus on ${suggestedSubject} with a short, steady review plan.`,
    strengths: strengths.slice(0, 3),
    growthAreas: growthAreas.slice(0, 3),
    coachingQuestions,
    encouragement,
    subjectPlans,
    suggestedSession: { topic: `Review ${suggestedSubject} together and turn one tricky area into a small practice routine this week` }
  };
}

  const gap = computeGapDisplay(row.currentResult, row.targetResult);

  const RO = state.mode==='caregiver';
  const isChild = state.mode==='child';
  const trend = row.subject ? buildTrendSVG(childId, row.subject, row.targetResult) : '';
  const resultSubjects = getResultSubjects(childId);
  const days = row.studyDays || [];
  const studyConflict = getStudyTimeConflict(childId, row.id);
  const practiceOption = row.practiceTestOption || 'none';
  return `
    <div class="card">
      <div class="plan-row-head">
        <select class="plan-subject-input" data-plan-subject-select="${childId}|${row.id}" ${RO||isChild?'disabled':''}>

// ---------- event wiring ----------
function attemptLogin(){
  const email = (document.getElementById('login-email')?.value || state.loginEmail || '').trim();
  const password = (document.getElementById('login-password')?.value || state.loginPassword || '').trim();

  state.loginEmail = email;
  state.loginPassword = password;

  if(!email || !password){
    state.loginError = 'Please enter both your email and password.';
    render();
    return;
  }

  const validEmail = /[a-z0-9._%+-]+@(?:[a-z0-9-]+\.)+[a-z]{2,}$/i.test(email);
  const validPassword = password.length >= 6;
  const acceptedUsers = {
    'coach@xcapital.com': 'XCapital123!',
    'admin@xcapitalresources.com': 'XCapital123!'
  };

  const validUser = validEmail && acceptedUsers[email.toLowerCase()] === password;

  if(!validUser || !validPassword){
    state.loginError = 'Incorrect email or password. Use the demo credential shown below.';
    render();
    return;
  }

  state.loginError = '';
  state.authenticated = true;
  state.parentProfile = state.parentProfile || {
    name: email.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase()),
    email,
    avatarEmoji: '🙂',
    avatarColor: AVATAR_COLORS[0],
    pin: '1234'
  };
  storeSet('parentProfile', state.parentProfile);
  createDemoChildIfNeeded();
  if(state.activeChildId) ensureDemoResultForCurrentChild();
  render();
}

function handleForgotPassword(){
  const message = 'Forgotten Password? Use the demo password: XCapital123! or contact the X-Capital Resources support desk for the Main Coach login.';
  state.loginError = message;
  state.sheetError = message;
  render();
}

function attachHandlers(){
  const loginToggle = document.getElementById('login-toggle');
  if(loginToggle){
    loginToggle.onclick = () => {
      if(state.authenticated){
        state.authenticated = false;
        state.loginError = '';
        state.loginEmail = '';
        state.loginPassword = '';
        render();
      } else {
        state.loginError = '';
        render();
      }
    };
  }

  const loginSubmit = document.getElementById('login-submit');
  if(loginSubmit) loginSubmit.onclick = attemptLogin;

  const forgotPassword = document.getElementById('forgot-password-link');
  if(forgotPassword) forgotPassword.onclick = handleForgotPassword;

  const forgotPin = document.getElementById('forgot-pin-link');
  if(forgotPin) forgotPin.onclick = handleForgotPassword;

  const loginEmailInput = document.getElementById('login-email');
  if(loginEmailInput) loginEmailInput.addEventListener('input', () => { state.loginEmail = loginEmailInput.value; });

  const loginPasswordInput = document.getElementById('login-password');
  if(loginPasswordInput) loginPasswordInput.addEventListener('input', () => { state.loginPassword = loginPasswordInput.value; });

  const savePP = document.getElementById('save-parent-profile');
  if(savePP) savePP.onclick = saveParentProfile;

  const dismissWelcome = document.getElementById('dismiss-welcome');
  if(dismissWelcome) dismissWelcome.onclick = ()=>{ state.showWelcomeBack=false; render(); };

  const openProfile = document.querySelector('[data-open-profile]');
  if(openProfile) openProfile.onclick = ()=>{
    const which = openProfile.getAttribute('data-open-profile');
    if(which==='parent') openParentProfileEdit(); else openChildProfileEdit();
  };

  document.querySelectorAll('[data-switch-mode]').forEach(el=>{
    el.addEventListener('click', ()=> switchMode(el.getAttribute('data-switch-mode')));
  });

  document.querySelectorAll('[data-avatar-emoji]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [prefix, emoji] = el.getAttribute('data-avatar-emoji').split('|');
      state.avatarTemp[prefix] = state.avatarTemp[prefix] || {emoji:AVATAR_EMOJIS[0], color:AVATAR_COLORS[0]};
      state.avatarTemp[prefix].emoji = emoji;
      render();
    });
  });
  document.querySelectorAll('[data-avatar-color]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [prefix, color] = el.getAttribute('data-avatar-color').split('|');
      state.avatarTemp[prefix] = state.avatarTemp[prefix] || {emoji:AVATAR_EMOJIS[0], color:AVATAR_COLORS[0]};
      state.avatarTemp[prefix].color = color;
      render();
    });
  });

  const addBtn = document.getElementById('add-child-btn');
  if(addBtn) addBtn.onclick = ()=> addChild(document.getElementById('new-child-name').value, document.getElementById('new-child-grade').value);
  const showAdd = document.getElementById('show-add-child');
  if(showAdd) showAdd.onclick = openAddChildSheet;

  document.querySelectorAll('[data-select]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ if(ev.target.closest('[data-remove]')) return; selectChild(el.getAttribute('data-select')); });
  });
  document.querySelectorAll('[data-remove]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); const id = el.getAttribute('data-remove'); requestConfirm('child|'+id, ()=> removeChild(id)); });
  });
  document.querySelectorAll('[data-expand]').forEach(el=>{ el.addEventListener('click', ()=> toggleExpand(el.getAttribute('data-expand'))); });
  document.querySelectorAll('[data-remove-entry]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, entryId] = el.getAttribute('data-remove-entry').split('|'); requestConfirm('entry|'+childId+'|'+entryId, ()=> removeEntry(childId, entryId)); });
  });
  document.querySelectorAll('[data-toggle-q]').forEach(el=>{
    el.addEventListener('change', ()=>{ const [childId, entryId, idx] = el.getAttribute('data-toggle-q').split('|'); toggleQuestion(childId, entryId, parseInt(idx,10)); });
  });

  document.querySelectorAll('[data-plan-field]').forEach(el=>{
    const updateRow = () => {
      const [childId, rowId, field] = el.getAttribute('data-plan-field').split('|');
      const row = (state.plansByChild[childId]||[]).find(r=>r.id===rowId);
      if(!row) return;
      row[field] = el.value;
      if(field === 'practiceTestOption' && el.value === 'none') {
        row.practiceTestDate = '';
        row.practiceTestTime = '';
      }
      if(field === 'studyTime' && row.studyTime){
        const conflicts = getStudyTimeConflict(childId, rowId);
        if(conflicts) {
          row.studyTime = row.studyTime;
        }
      }
    };
    el.addEventListener('input', updateRow);
    el.addEventListener('change', updateRow);
    el.addEventListener('blur', ()=>{
      const [childId, rowId, field] = el.getAttribute('data-plan-field').split('|');
      const row = (state.plansByChild[childId]||[]).find(r=>r.id===rowId);
      if(row && (field==='targetResult' || field==='currentResult')){
        if(row[field] && (!row.targetLocked || field==='currentResult')) {
          row[field] = formatAsPercent(row[field]);
        }
      }
      persistPlan(childId);
      render();
    });
  });
  document.querySelectorAll('[data-toggle-lock]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, rowId] = el.getAttribute('data-toggle-lock').split('|'); toggleTargetLock(childId, rowId); });
  });
  document.querySelectorAll('[data-plan-subject-select]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const [childId, rowId] = el.getAttribute('data-plan-subject-select').split('|');
      selectPlanSubject(childId, rowId, el.value);
    });
  });
  document.querySelectorAll('[data-toggle-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [childId, rowId, day] = el.getAttribute('data-toggle-day').split('|');
      toggleStudyDay(childId, rowId, day);
    });
  });
  document.querySelectorAll('[data-cycle-rag]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, rowId] = el.getAttribute('data-cycle-rag').split('|'); cycleRag(childId, rowId); });
  });
  document.querySelectorAll('[data-toggle-plan-row]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, rowId] = el.getAttribute('data-toggle-plan-row').split('|'); togglePlanRowOpen(childId, rowId); });
  });
  document.querySelectorAll('[data-remove-plan-row]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, rowId] = el.getAttribute('data-remove-plan-row').split('|'); requestConfirm('planrow|'+childId+'|'+rowId, ()=> removePlanRow(childId, rowId)); });
  });
  const addPlanRowBtn = document.getElementById('add-plan-row');
  if(addPlanRowBtn) addPlanRowBtn.onclick = ()=> addPlanRow(state.activeChildId);

  document.querySelectorAll('[data-note-draft]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const [childId, rowId] = el.getAttribute('data-note-draft').split('|');
      const row = (state.plansByChild[childId]||[]).find(r=>r.id===rowId);
      if(row) row.notesDraft = el.value;
    });
    el.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter' && !ev.shiftKey){
        ev.preventDefault();
        const [childId, rowId] = el.getAttribute('data-note-draft').split('|');
        saveNoteEntry(childId, rowId, el.value);
      }
    });
  });
  document.querySelectorAll('[data-save-note]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [childId, rowId] = el.getAttribute('data-save-note').split('|');
      const ta = document.querySelector(`[data-note-draft="${childId}|${rowId}"]`);
      saveNoteEntry(childId, rowId, ta ? ta.value : undefined);
    });
  });

  document.querySelectorAll('[data-session-field]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const [childId, id, field] = el.getAttribute('data-session-field').split('|');
      const s = (state.sessionsByChild[childId]||[]).find(x=>x.id===id);
      if(s) s[field] = el.value;
    });
    el.addEventListener('change', ()=>{ const [childId] = el.getAttribute('data-session-field').split('|'); persistSessions(childId); });
    el.addEventListener('blur', ()=>{ const [childId] = el.getAttribute('data-session-field').split('|'); persistSessions(childId); });
  });
  document.querySelectorAll('[data-toggle-session-row]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, id] = el.getAttribute('data-toggle-session-row').split('|'); toggleSessionOpen(childId, id); });
  });
  document.querySelectorAll('[data-toggle-session]').forEach(el=>{
    el.addEventListener('change', ()=>{ const [childId, id] = el.getAttribute('data-toggle-session').split('|'); toggleSessionDone(childId, id); });
  });
  document.querySelectorAll('[data-remove-session]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, id] = el.getAttribute('data-remove-session').split('|'); requestConfirm('session|'+childId+'|'+id, ()=> removeSession(childId, id)); });
  });
  document.querySelectorAll('[data-cal]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [childId, id] = el.getAttribute('data-cal').split('|');
      const s = (state.sessionsByChild[childId]||[]).find(x=>x.id===id);
      if(s) downloadICS(s.topic || 'Study session', 'Margin: parent-child session', s.date);
    });
  });
  const addSessionBtn = document.getElementById('add-session');
  if(addSessionBtn) addSessionBtn.onclick = ()=> addSession(state.activeChildId);

  document.querySelectorAll('[data-view]').forEach(el=>{ el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-view'); render(); }); });

  const fab = document.getElementById('fab-add');
  if(fab) fab.onclick = ()=> state.view==='tips' ? openTipSheet() : openActionSheet();

  const overlay = document.getElementById('sheet-overlay');
  if(overlay) overlay.onclick = closeSheet;
  const sheetClose = document.getElementById('sheet-close');
  if(sheetClose) sheetClose.onclick = closeSheet;

  const sheetAddChildBtn = document.getElementById('sheet-add-child-btn');
  if(sheetAddChildBtn) sheetAddChildBtn.onclick = ()=> addChild(document.getElementById('sheet-child-name').value, document.getElementById('sheet-child-grade').value);

  const actionPhoto = document.getElementById('action-photo');
  if(actionPhoto) actionPhoto.onclick = ()=>{ state.sheet = null; render(); setTimeout(()=>{ const gfi = document.getElementById('global-file-input'); if(gfi) gfi.click(); }, 50); };
  const actionManual = document.getElementById('action-manual');
  if(actionManual) actionManual.onclick = openManualSheet;

  document.querySelectorAll('.m-name, .m-score').forEach(el=>{
    el.addEventListener('input', ()=>{
      const [field, id] = el.getAttribute('data-field').split('|');
      const row = state.manualSubjects.find(r=>r.id===id);
      if(row) row[field] = el.value;
    });
  });
  const notesEl = document.getElementById('manual-notes');
  if(notesEl) notesEl.addEventListener('input', ()=> state.manualNotes = notesEl.value);
  document.querySelectorAll('[data-remove-row]').forEach(el=>{ el.addEventListener('click', ()=> removeManualRow(el.getAttribute('data-remove-row'))); });
  document.querySelectorAll('[data-set-assess]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [id, val] = el.getAttribute('data-set-assess').split('|'); setManualAssessment(id, val); });
  });
  const addRowBtn = document.getElementById('add-manual-row');
  if(addRowBtn) addRowBtn.onclick = addManualRow;
  const submitManualBtn = document.getElementById('submit-manual');
  if(submitManualBtn) submitManualBtn.onclick = ()=> runAnalysis({mode:'manual'});

  const openTipBtn = document.getElementById('open-tip-sheet');
  if(openTipBtn) openTipBtn.onclick = openTipSheet;
  document.querySelectorAll('[data-quick-tip]').forEach(el=>{
    el.addEventListener('click', ()=>{ openTipSheet(); state.tipSubject = el.getAttribute('data-quick-tip'); render(); });
  });
  document.querySelectorAll('[data-toggle-tip]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, id] = el.getAttribute('data-toggle-tip').split('|'); toggleTipOpen(childId, id); });
  });
  document.querySelectorAll('[data-remove-tip]').forEach(el=>{
    el.addEventListener('click', ()=>{ const [childId, id] = el.getAttribute('data-remove-tip').split('|'); requestConfirm('tip|'+childId+'|'+id, ()=> removeTip(childId, id)); });
  });
  const tipSubjectInput = document.getElementById('tip-subject-input');
  if(tipSubjectInput) tipSubjectInput.addEventListener('input', ()=> state.tipSubject = tipSubjectInput.value);
  const tipStruggleInput = document.getElementById('tip-struggle-input');
  if(tipStruggleInput) tipStruggleInput.addEventListener('input', ()=> state.tipStruggle = tipStruggleInput.value);
  document.querySelectorAll('[data-select-tip-subject]').forEach(el=>{ el.addEventListener('click', ()=> selectTipSubject(el.getAttribute('data-select-tip-subject'))); });
  const submitTipBtn = document.getElementById('submit-tip');
  if(submitTipBtn) submitTipBtn.onclick = generateTip;

  const pinInput = document.getElementById('pin-input');
  if(pinInput) pinInput.addEventListener('input', ()=> state.pinInput = pinInput.value);
  const submitPin = document.getElementById('submit-pin');
  if(submitPin) submitPin.onclick = checkPin;

  const openCg = document.getElementById('open-caregiver-sheet');
  if(openCg) openCg.onclick = openCaregiverSheet;
  const saveCg = document.getElementById('save-caregiver');
  if(saveCg) saveCg.onclick = saveCaregiver;
  const removeCg = document.getElementById('remove-caregiver');
  if(removeCg) removeCg.onclick = removeCaregiver;

  const savePPE = document.getElementById('save-parent-profile-edit');
  if(savePPE) savePPE.onclick = saveParentProfileEdit;
  const saveCPE = document.getElementById('save-child-profile-edit');
  if(saveCPE) saveCPE.onclick = saveChildProfileEdit;

  const openSummary = document.getElementById('open-summary-sheet');
  if(openSummary) openSummary.onclick = openSummarySheet;
  const copySummaryBtn = document.getElementById('copy-summary');
  if(copySummaryBtn) copySummaryBtn.onclick = copySummary;

  const gfi = document.getElementById('global-file-input');
  if(gfi) gfi.onchange = ()=>{ if(gfi.files[0]) runAnalysis({mode:'photo', file:gfi.files[0]}); gfi.value = ''; };
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* not supported in this context, app still works as a normal page */ });
  });
}
</script>
</body>
</html>
